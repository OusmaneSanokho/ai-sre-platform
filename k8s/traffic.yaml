apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic
  namespace: shop
  labels:
    app: traffic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic
  template:
    metadata:
      labels:
        app: traffic
    spec:
      containers:
        - name: traffic
          image: curlimages/curl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                code=$(curl -s -o /dev/null --max-time 5 -w "%{http_code}" http://orders-api/orders)
                echo "$(date -u +%H:%M:%S) GET /orders -> $code"
                sleep 2
              done